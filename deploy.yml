

- hosts: app
  become: yes
  tasks:
    # ---- Standard build baseline (ISO 27001 A.8.9 Configuration management, A.8.8 Vulnerability management) ----
    - name: Update apt cache and apply security updates
      apt:
        update_cache: yes
        upgrade: safe

    - name: Install Docker, Docker Python module and UFW
      apt:
        name:
          - docker.io
          - python3-docker
          - ufw
        state: present

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow HTTP
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Enable firewall (deny other incoming)
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming

    # ---- Deployment ----
    - name: Run app container
      community.docker.docker_container:
        name: ctg-app
        image: "{{ image }}"
        pull: yes
        state: started
        restart_policy: always
        ports:
          - "80:5000"